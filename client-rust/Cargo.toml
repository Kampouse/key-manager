[package]
name = "key-manager-client"
version = "0.1.0"
edition = "2021"
description = "Rust client for Key-Manager TEE-based encrypted storage"
license = "MIT"
repository = "https://github.com/Kampouse/key-manager"
keywords = ["tee", "encryption", "near", "blockchain", "storage"]
categories = ["cryptography", "api-bindings"]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.21"
hkdf = "0.12"
sha2 = "0.12"
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"
